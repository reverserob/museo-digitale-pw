# Integrazione continua: a ogni push e pull request controlla backend e frontend.
# Se un controllo fallisce, su GitHub compare la croce rossa accanto al commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # il backend deve funzionare con qualsiasi Python dalla 3.9 in poi:
        # 3.9 = la più vecchia supportata, 3.12 = come sul server, 3.15 = la più recente
        python-version: ["3.9", "3.12", "3.15"]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Installa le dipendenze
        run: pip install -r requirements-dev.txt

      - name: Controllo del codice (ruff)
        run: ruff check .

      - name: Controllo della formattazione (ruff format)
        run: ruff format --check .

      - name: Test (pytest) con misura della copertura
        # la soglia minima (90%) e i file esclusi sono in backend/.coveragerc: sotto soglia il job fallisce
        run: pytest --cov --cov-report=term --cov-report=xml --cov-report=html

      - name: Pubblica il report di copertura
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: copertura-backend
          path: |
            backend/coverage.xml
            backend/htmlcov/

  backend-postgres:
    # stessa suite di test su un PostgreSQL vero, il database usato in produzione
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: museo_test
        ports:
          - 5432:5432
        # aspetta che il database sia pronto prima di eseguire i test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/museo_test
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Installa le dipendenze
        run: pip install -r requirements-dev.txt

      - name: Test su PostgreSQL (pytest) con misura della copertura
        run: pytest --cov --cov-report=term

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installa le dipendenze
        run: npm ci

      - name: Controllo del codice (ESLint)
        run: npm run lint

      - name: Controllo della formattazione (Prettier)
        run: npm run format:check

      - name: Test (Vitest) con misura della copertura
        # file inclusi/esclusi e soglia minima (90% delle righe) in frontend/vite.config.js
        run: npm run test:coverage

      - name: Pubblica il report di copertura
        uses: actions/upload-artifact@v4
        with:
          name: copertura-frontend
          path: frontend/coverage/

      - name: Build di produzione
        run: npm run build

  docs:
    name: Documentazione
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Genera la documentazione del frontend (JSDoc)
        working-directory: frontend
        run: |
          npm ci
          npm run docs

      - name: Esporta lo schema OpenAPI per la Swagger UI
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python esporta_openapi.py ../docs/swagger/openapi.json

      - name: Genera il sito (MkDocs, errori bloccanti)
        run: |
          pip install -r backend/requirements-docs.txt
          mkdocs build --strict
