# Pubblica la documentazione su GitHub Pages a ogni push su main.
# Prima genera la documentazione del frontend con JSDoc (in docs/frontend-api/),
# poi il sito MkDocs con la reference del backend (mkdocstrings) nella cartella site/.
# Requisito una tantum: Settings → Pages → Source = "GitHub Actions".
name: Documentazione

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# una sola pubblicazione alla volta; quella in corso viene completata
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Genera il sito
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-docs.txt

      - name: Documentazione del frontend (JSDoc)
        working-directory: frontend
        run: |
          npm ci
          npm run docs

      - name: Sito MkDocs con la reference del backend
        run: |
          pip install -r backend/requirements-docs.txt
          mkdocs build --strict

      - name: Prepara il sito per GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Pubblica su GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
